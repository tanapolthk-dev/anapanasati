# Deploy Anapanasati to GitHub Pages ทุกครั้งที่ push เข้า branch main
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        run: |
          for f in index.html manifest.webmanifest sw.js privacy.html; do
            test -f "$f" || { echo "Missing $f"; exit 1; }
          done

      - name: Prepare site folder
        run: |
          mkdir -p _site
          cp -r index.html privacy.html manifest.webmanifest sw.js icons audio _site/
          [ -f ads.txt ] && cp ads.txt _site/ || true
          [ -f CNAME ] && cp CNAME _site/ || true
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
